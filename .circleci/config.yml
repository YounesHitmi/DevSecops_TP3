version: 2.1

# List of all environment variables accessible in this config file
# https://circleci.com/docs/2.0/env-vars/#built-in-environment-variables

# Recommendations
# ---------------

# General Principles:
#
#  1. Descriptive: The job name should clearly describe what the job does.
#  2. Concise: Names should be as short as possible while still being descriptive.
#  3. Consistent: Use a consistent format or pattern for all job names.
#  4. Avoid Ambiguous Abbreviations: If you use abbreviations, ensure they are widely understood.
#
# Naming Convention Proposal:
#
#  1. Prefixes based on the nature of the job:
#     - build-: for jobs related to building or installation.
#     - lint-: for jobs related to code quality checking.
#     - test-: for jobs related to testing.
#     - security-: for jobs related to security.
#     - metrics-: for jobs related to metrics generation.
#     - deploy-: for jobs related to deployment.
#     - notify-: for jobs related to notifications.
#     - debug-: for jobs related to debugging.
#     - setup-: for jobs related to set up.
#     - init-: for jobs related to initialization.
#     - generate-: for jobs related to generation.
#     - validate-: for jobs related to validation.
#     - compile-: for jobs related to compilation.
#     - e2e-: for jobs related to end-to-end testing.
#
#  2. Suffixes based on the specific tool or task:
#  For example, for a job that uses PHP_CodeSniffer, use phpcs as a suffix.


# Default configuration for persist_to_workspace and attach_workspace commands
persist_to_workspace: &persist_to_workspace
  persist_to_workspace:
    root: .
    paths:
      - .

attach_workspace: &attach_workspace
  attach_workspace:
    # Must be absolute path or relative path from working_directory
    at: ~/project

# This main executor is used by all jobs unless otherwise specified
executors:
  php-executor:
    resource_class: small
    shell: /bin/bash
    docker:
      - name: localhost
        image: cimg/php:8.2
  builder-executor:
    resource_class: small
    shell: /bin/bash
    docker:
      - image: cimg/php:8.2-node
        name: localhost
  simple-executor:
    resource_class: small
    shell: /bin/bash
    docker:
      - image: cimg/base:stable
        name: localhost



jobs:
  debug-info:
    executor: php-executor
    steps:
      - run:
          name: Debug
          command: |
            echo "Current user: $USER"
            echo "Home directory: $HOME"
            echo "Current shell: $SHELL"
            echo "Operating system: $(uname -a)"
            echo "Current path: $PATH"
            echo "Current working directory: $(pwd)"
            echo "Current date: $(date)"
            echo "--------------------"
            env

  build-setup:
    executor: php-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            # "composer.lock" can be used if it is committed to the repo
            - v1-dependencies-{{ checksum "composer.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-
      - run:
          name: Install dependencies
          command: composer install --no-interaction --no-ansi --prefer-dist
      - save_cache:
          paths:
            - ./vendor
          key: v1-dependencies-{{ checksum "composer.json" }}
      - *persist_to_workspace


  lint-phpcs:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Install PHP_CodeSniffer and PHPCompatibility
          command: composer require --dev "squizlabs/php_codesniffer=*" "phpcompatibility/php-compatibility=*"
      - run:
          # Part 5: the job is now blocking (before, exit codes 1 and 2 were turned into success)
          name: Run PHP_CodeSniffer with Custom Ruleset in the project root
          command: |
            ./vendor/bin/phpcs --standard=phpcs.xml --report=full --report-checkstyle=phpcs-report.txt --extensions=php --ignore=vendor/ .
      - store_artifacts:
          path: phpcs-report.txt
          destination: phpcs-report



  security-check-dependencies:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          # Part 5: local-php-security-checker did not detect CVE-2025-22145 (nesbot/carbon).
          # composer audit uses the GitHub/Packagist advisories and fails if a production dependency is vulnerable.
          name: Audit production dependencies (composer audit)
          command: |
            set -uo pipefail
            composer audit --no-dev --format=json > security-report.json
            status=$?
            composer audit --no-dev || true
            exit $status
      - store_artifacts:
          path: security-report.json
          destination: security-report


  lint-hadolint:
    executor: simple-executor
    environment:
      HADOLINT_VERSION: 2.12.0
      HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
    steps:
      - checkout
      - run:
          name: Download hadolint (pinned version + checksum)
          command: |
            set -euo pipefail
            curl -sSfL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
            echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
            chmod +x hadolint
      - run:
          name: Lint the Dockerfile (rules in .hadolint.yaml)
          command: ./hadolint Docker/Dockerfile


  security-scan-secrets:
    executor: simple-executor
    environment:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - checkout
      - run:
          name: Download gitleaks (pinned version + checksum)
          command: |
            set -euo pipefail
            curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
            tar -xzf gitleaks.tar.gz gitleaks
      - run:
          # Scans the whole git history. Old, revoked secrets are listed in .gitleaksignore.
          name: Search secrets in the git history
          command: ./gitleaks git . --redact --verbose --no-banner



  test-phpunit:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Check if PHPUnit tests are present, otherwise skip the job
          command: |
            if [ ! -f "phpunit.xml" ]; then
              echo "No PHPUnit tests found, skipping job."
              echo "export SKIP_PHPUNIT=true" >> $BASH_ENV
              circleci step halt
            fi
      - run:
          name: Run PHPUnit
          command: ./vendor/bin/phpunit --testsuite=Unit


  metrics-phpmetrics:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Generate PhpMetrics report
          command: ./vendor/bin/phpmetrics --report-html=reports/phpmetrics src
      - store_artifacts:
          path: reports/phpmetrics
          destination: phpmetrics-report


  metrics-phploc:
    executor: php-executor
    environment:
      PHPLOC_VERSION: 7.0.2
      PHPLOC_SHA256: 3d59778ec86faf25fd00e3a329b2f9ad4a3c751ca91601ea7dab70f887b0bf46
    steps:
      - *attach_workspace
      - run:
          name: Download phploc (pinned version + checksum)
          command: |
            curl -sSfL -o phploc.phar "https://phar.phpunit.de/phploc-${PHPLOC_VERSION}.phar"
            echo "${PHPLOC_SHA256}  phploc.phar" | sha256sum -c -
      - run:
          name: Run phploc
          command: |
            set -o pipefail
            mkdir -p reports
            php phploc.phar src public | tee reports/phploc.txt
      - store_artifacts:
          path: reports/phploc.txt
          destination: phploc-report/phploc.txt


  lint-phpmd:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Run PHPMD (rules in phpmd.xml)
          command: |
            mkdir -p reports
            ./vendor/bin/phpmd analyze src public \
              --ruleset phpmd.xml \
              --format text \
              --reportfile-html reports/phpmd.html \
              --no-progress
      - store_artifacts:
          path: reports/phpmd.html
          destination: phpmd-report/phpmd.html


  lint-php-doc-check:
    executor: php-executor
    steps:
      - *attach_workspace
      - run:
          name: Run php-doc-check (complex code must be documented)
          command: |
            set -o pipefail
            mkdir -p reports
            ./vendor/bin/php-doc-check src public | tee reports/php-doc-check.txt
      - store_artifacts:
          path: reports/php-doc-check.txt
          destination: php-doc-check-report/php-doc-check.txt


  build-docker-image:
    executor: builder-executor
    environment:
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          name: Build the Docker image
          command: |
            set -euo pipefail
            if [ -n "${SKIP_BUILD:-}" ]; then
              echo "Skipping build"
              circleci step halt
              exit 0
            fi

            # Sanitize the repository name and branch name
            REPOSITORY=$(echo "ghcr.io/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" | tr '[:upper:]' '[:lower:]' | tr -d '_')
            TAG=$(echo $CIRCLE_BRANCH | tr '[:upper:]' '[:lower:]' | tr '/' '-' | tr -cd '[:alnum:]._-' | cut -c 1-128)
            echo "export IMAGE=$REPOSITORY:$TAG" >> "$BASH_ENV"

            docker build \
            -f Docker/Dockerfile \
            -t $REPOSITORY:$TAG \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --build-arg TAG="${TAG}" \
            --build-arg GIT_COMMIT=$(git rev-parse -q --verify HEAD) \
            --build-arg GIT_URL=$(echo ${CIRCLE_REPOSITORY_URL} | sed -e 's/^git@/https:\/\//g' -e 's/\.git$//g' -e 's/:/\//g') \
            --build-arg PROJECT_USERNAME=$CIRCLE_PROJECT_USERNAME \
            .
      - run:
          name: Download Trivy (pinned version + checksum)
          command: |
            set -euo pipefail
            curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
            echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
            tar -xzf trivy.tar.gz trivy
      - run:
          name: Scan the image with Trivy (full report)
          command: |
            set -euo pipefail
            docker save -o image.tar "$IMAGE"
            ./trivy image --input image.tar --scanners vuln --severity HIGH,CRITICAL --format table -o trivy-report.txt
            head -n 40 trivy-report.txt
      - store_artifacts:
          path: trivy-report.txt
          destination: trivy-report/trivy-report.txt
      - run:
          # Security gate: the image is NOT pushed if it has a CRITICAL vulnerability that already has a fix.
          name: Security gate - no fixable CRITICAL vulnerability
          command: ./trivy image --input image.tar --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --skip-db-update
      - run:
          name: Push the Docker image to GHCR (GitHub Container Registry)
          command: |
            set -euo pipefail
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker push "$IMAGE"


  deploy-ssh-staging:
    executor: simple-executor
    steps:
      - add_ssh_keys:
          fingerprints:
            - "${STAGING_SSH_FINGERPRINT}"
      - deploy:
          name: Deploy to AWS
          command: |
            set -x
            ssh -o StrictHostKeyChecking=no $STAGING_SSH_USER@$STAGING_SSH_HOST \<< EOF
            PHP_FPM_VERSION=$(php -v | head -n 1 | cut -d ' ' -f 2 | cut -d '.' -f 1-2)
            cd $STAGING_DEPLOY_DIRECTORY
            git pull origin $CIRCLE_BRANCH
            composer install --optimize-autoloader --no-interaction --prefer-dist
            (flock -w 10 9 || exit 1; sudo -S service php${PHP_FPM_VERSION}-fpm restart ) 9>/tmp/fpm.lock
            EOF


#  deploy-ssh-production:
# Part 3.3: production is deployed on AWS (ECR + ECS on EC2) by GitHub Actions,
# see .github/workflows/aws.yml (triggered by a push on main).


workflows:
  main_workflow:
    jobs:
      - debug-info
      - build-setup
      - lint-phpcs:
          requires:
            - build-setup
      - security-check-dependencies:
          requires:
            - build-setup
      - test-phpunit:
          requires:
            - build-setup
      - metrics-phpmetrics:
          requires:
            - build-setup
      - metrics-phploc:
          requires:
            - build-setup
      - lint-phpmd:
          requires:
            - build-setup
      - lint-php-doc-check:
          requires:
            - build-setup
      - lint-hadolint
      - security-scan-secrets
      - hold:
          type: approval
          # Part 5: the approval is only possible once every blocking check is green
          requires:
            - lint-phpcs
            - lint-phpmd
            - lint-php-doc-check
            - lint-hadolint
            - test-phpunit
            - security-check-dependencies
            - security-scan-secrets
          filters:
            branches:
              only:
                - main
                - master
                - /^release\/.*/
      #- deploy-ssh-production:
      #    requires:
      #        - hold
      #    filters:
      #      branches:
      #        only:
      #          - main
      #         - master
      - deploy-ssh-staging:
          requires:
            - hold
          filters:
            branches:
              only:
                - /^release\/.*/


  container_workflow:
    jobs:
      - build-docker-image:
          filters:
            branches:
              only:
                - master
                - main
                - develop
                - /^feature\/.*/
                - /^release\/.*/
                - /^hotfix\/.*/
                - /^bugfix\/.*/